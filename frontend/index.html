<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><meta name="color-scheme" content="light dark"/><title>Elixir</title><link rel="icon" type="image/png" href="/elixir-icon.png"/>
<script>
(function(){try{
  if(new URLSearchParams(location.search).has('desktopLyrics'))return;
  var s=JSON.parse(localStorage.getItem('elixir-boot')||'{}');
  if(/^#[0-9a-f]{6}$/i.test(s.bg||''))document.documentElement.style.background=s.bg;
}catch(e){}})();
</script>
</head><body><div id="root"></div><script type="module" src="/src/main.jsx"></script></body></html>
